name: Build, Push & Deploy API to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            mirakel14/cal-diy-api:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-args: |
            DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            CALENDSO_ENCRYPTION_KEY=${{ secrets.CALENDSO_ENCRYPTION_KEY }}
            NEXT_PUBLIC_WEBAPP_URL=${{ secrets.LIGHTSAIL_WEB_URL }}
            API_URL=${{ secrets.LIGHTSAIL_API_URL }}
            MAX_OLD_SPACE_SIZE=4096

      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            docker pull mirakel14/cal-diy-api:latest
            docker stop calcom-api || true
            docker rm calcom-api || true
            docker run -d \
              --name calcom-api \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /home/ubuntu/cal-diy/.env \
              mirakel14/cal-diy-api:latest
