name: Build, Push & Deploy API to Render

on:
  push:
    branches: [ main ]
    workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            mirakel14/cal-diy-api:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-args: |
            DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            CALENDSO_ENCRYPTION_KEY=${{ secrets.CALENDSO_ENCRYPTION_KEY }}
            NEXT_PUBLIC_WEBAPP_URL=https://cal-diy-api-latest.onrender.com
            MAX_OLD_SPACE_SIZE=4096

      - name: Trigger Deploy on Render
        run: |
          curl -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}"