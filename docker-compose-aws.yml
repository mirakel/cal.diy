version: '3.8'

volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: database
    image: postgres:15-alpine
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-neondb_owner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-npg_umlICyH5Ba4v}
      - POSTGRES_DB=${POSTGRES_DB:-neondb}
    ports:
      - "5450:5432"
    networks:
      - stack
    deploy:
      resources:
        limits:
          memory: 800M

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - stack
    deploy:
      resources:
        limits:
          memory: 200M

  calcom:
    container_name: calcom
    image: mirakel14/cal-diy:latest
    restart: always
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_DIRECT_URL=${DATABASE_DIRECT_URL}
      - PORT=3000
    networks:
      - stack
    deploy:
      resources:
        limits:
          memory: 1500M
    depends_on:
      - database

  calcom-api:
    container_name: calcom-api
    image: mirakel14/cal-diy-api:latest
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NODE_OPTIONS=${NODE_OPTIONS:-"--max-old-space-size=3072"}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      - API_PORT=3000
      - API_URL=${API_URL}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_READ_URL=${DATABASE_URL}
      - DATABASE_WRITE_URL=${DATABASE_URL}
      - DATABASE_DIRECT_URL=${DATABASE_DIRECT_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - API_KEY_PREFIX=${API_KEY_PREFIX}
      - WEB_APP_URL=${WEB_APP_URL}
      - CALCOM_LICENSE_KEY=${CALCOM_LICENSE_KEY}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - SWAGGER_CUSTOM_CSS_URL=/docs/swagger-ui.css
      - SWAGGER_CUSTOM_JS=/docs/swagger-ui-bundle.js
    networks:
      - stack
    deploy:
      resources:
        limits:
          memory: 1500M
    depends_on:
      - database
      - redis